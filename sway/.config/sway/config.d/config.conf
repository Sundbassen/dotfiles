# Lock screen
set $locking swaylock --image ~/Pictures/nz.jpg
set $locksus swaylock --image ~/Pictures/nz.jpg & sleep 0.1 && systemctl suspend
bindsym $mod+Shift+a exec $locking
bindsym $mod+Shift+w exec $locksus 
# Copylist 
set $copylist cliphist list | rofi -dmenu -font "$gui-font" -p "Select item to copy" -lines 10 | cliphist decode | wl-copy 
bindsym $mod+Shift+v exec $copylist
bindsym $mod+Shift+x  resize set width 80 ppt

